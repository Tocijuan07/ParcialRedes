$kind: http-request
name: 02 GET filtro ?huesped= -> 200
url: "{{base}}/reservas?huesped=Ilana Urrea"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  huesped: Ilana Urrea
scripts:
  - type: afterResponse
    code: |-
      pm.test('Código 200', () => pm.response.to.have.status(200));
      pm.test('Solo del huésped', () => pm.response.json().every(r => r.huesped === 'Ilana Urrea'));
    language: text/javascript
order: 3000
