$kind: http-request
name: 10 PUT actualizar -> 200
url: "{{base}}/reservas/{{idCreado}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "codigo": "RES-100",
      "huesped": "Ana Torres",
      "fecha_entrada": "2027-03-01",
      "fecha_salida": "2027-03-05",
      "personas": 3
    }
scripts:
  - type: afterResponse
    code: pm.test('Código 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 11000
