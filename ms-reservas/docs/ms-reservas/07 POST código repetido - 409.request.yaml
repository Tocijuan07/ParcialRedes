$kind: http-request
name: 07 POST código repetido -> 409
url: "{{base}}/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "codigo": "RES-100",
      "huesped": "Ana Torres",
      "fecha_entrada": "2027-03-01",
      "fecha_salida": "2027-03-05",
      "personas": 2
    }
scripts:
  - type: afterResponse
    code: pm.test('Código 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 8000
