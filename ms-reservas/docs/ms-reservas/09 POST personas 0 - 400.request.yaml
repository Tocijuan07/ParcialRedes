$kind: http-request
name: 09 POST personas 0 -> 400
url: "{{base}}/reservas"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "codigo": "RES-102",
      "huesped": "Ana Torres",
      "fecha_entrada": "2027-03-01",
      "fecha_salida": "2027-03-05",
      "personas": 0
    }
scripts:
  - type: afterResponse
    code: pm.test('Código 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 10000
